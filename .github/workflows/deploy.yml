name: Deploy

# Deploys to Cloudflare Workers when main moves — whether that is a direct
# push or a merged pull request. Tests must pass first: a red build never
# reaches production.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead of cancelling, so the last
# commit on main is always what ends up live.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Fail early and legibly rather than letting wrangler error out with
      # something cryptic. The account id lives in wrangler.jsonc, so the
      # token is the only thing that has to be configured.
      - name: Check the Cloudflare credentials are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Create a token with the"
            echo "::error::'Edit Cloudflare Workers' template at"
            echo "::error::https://dash.cloudflare.com/profile/api-tokens then add it under"
            echo "::error::Settings > Secrets and variables > Actions in this repo."
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Find it in the Cloudflare"
            echo "::error::dashboard under Workers & Pages, then add it as a repo secret."
            echo "::error::It is no longer hardcoded in wrangler.jsonc, because a stale"
            echo "::error::value there points deploys at the wrong account."
            exit 1
          fi
          if [ -z "${{ vars.DEPLOY_URL }}" ]; then
            echo "::error::DEPLOY_URL is not set. Add it under Settings > Secrets and"
            echo "::error::variables > Actions > Variables, e.g."
            echo "::error::https://stag-acquisitions-site.<your-subdomain>.workers.dev"
            echo "::error::or https://stagacquisitions.com once the domain is attached."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # dist/ is already built above; do not let the action rebuild it.
          command: deploy

      - name: Smoke-check the live site
        run: |
          for path in / /how-it-works /values /markets /investors /offer /disclosures \
                      /privacy /nashville /brentwood /charlotte /scottsdale \
                      /robots.txt /llms.txt; do
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                "${{ vars.DEPLOY_URL }}${path}")
              [ "$code" = "200" ] && break
              echo "  ${path} -> ${code}, retrying (${attempt}/6)"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned ${code} after deploy"
              exit 1
            fi
            echo "  ${path} -> 200"
          done

          # A mistyped postcard URL must land on our 404, not Cloudflare's.
          body=$(curl -s "${{ vars.DEPLOY_URL }}/nashvile-typo-check")
          if ! echo "$body" | grep -q "That page is not here"; then
            echo "::error::unknown paths are not serving the custom 404 page"
            exit 1
          fi
          echo "  404 handling -> ok"
